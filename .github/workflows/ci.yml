name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build & verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Electron binaries are not needed on CI: typechecking only needs types.
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Build shared packages
        run: |
          npm run build -w @cabinet/core
          npm run build -w @cabinet/db

      - name: Typecheck all workspaces
        run: |
          npm run typecheck -w @cabinet/core
          npm run typecheck -w @cabinet/db
          npm run typecheck -w cabinet-keyvault
          npm run typecheck -w cabinet-desktop
          npm run typecheck -w cabinet-web

      - name: Key vault selftest (encrypt → decrypt round-trip)
        run: |
          npm run build -w cabinet-keyvault
          node tools/keyvault/dist/cli.js selftest

      - name: Build web app
        run: npm run build -w cabinet-web
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
