<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Cabinet</title>
<style>
  html, body { margin: 0; height: 100%; background: #07070b; overflow: hidden; }
  iframe { width: 100%; height: 100%; border: 0; }
  #status {
    position: fixed; inset: auto 0 0 0; padding: 12px 24px;
    color: rgba(255,255,255,0.55); font: 24px sans-serif;
    background: rgba(7,7,11,0.8); display: none;
  }
</style>
</head>
<body>
<iframe id="cabinet" src="https://cabinet-eta-gilt.vercel.app/tv" allow="gamepad; autoplay; fullscreen"></iframe>
<div id="status"></div>
<script>
  // ── Cabinet Samsung TV shell ──────────────────────────────────────────────
  // The hosted TV app runs in the frame above; this packaged shell registers
  // the extra remote keys (the mandatory arrows/Enter/Back arrive as normal
  // keyboard events) and forwards everything into the app as key events.

  var frame = document.getElementById("cabinet");
  var status = document.getElementById("status");

  function showStatus(text) {
    status.textContent = text;
    status.style.display = "block";
    setTimeout(function () { status.style.display = "none"; }, 4000);
  }

  function forwardKey(event, type) {
    frame.contentWindow.postMessage(
      { type: "cabinet-tv-key", eventType: type, key: event.key, code: event.code, keyCode: event.keyCode },
      "*"
    );
  }

  document.addEventListener("keydown", function (event) {
    // Back / Return-exit on Samsung remotes.
    if (event.key === "Escape" || event.keyCode === 10009 || event.keyCode === 461) {
      if (typeof tizen !== "undefined" && tizen.application) {
        tizen.application.getCurrentApplication().exit();
      }
      return;
    }
    forwardKey(event, "keydown");
  });
  document.addEventListener("keyup", function (event) {
    forwardKey(event, "keyup");
  });

  // Register optional remote keys so their events reach the app at all.
  // Mandatory keys (arrows/Enter/Back) must NOT be registered — they arrive as
  // normal keyboard events. getKey() throws for keys this model doesn't expose.
  if (typeof tizen !== "undefined" && tizen.tvinputdevice) {
    var registered = 0;
    ["ChannelUp", "ChannelDown", "MediaPlayPause", "MediaPlay", "MediaPause",
     "MediaRewind", "MediaFastForward", "MediaStop", "ColorF0Red", "ColorF1Green",
     "ColorF2Yellow", "ColorF3Blue"].forEach(function (key) {
      try {
        if (tizen.tvinputdevice.getKey(key)) {
          tizen.tvinputdevice.registerKey(key);
          registered += 1;
        }
      } catch (e) { /* unsupported key on this model */ }
    });
    window.addEventListener("unregistered", function () { /* keys released on exit */ });
    showStatus("Cabinet — remote registered (" + registered + " extra keys)");
  } else {
    showStatus("Cabinet — running outside Tizen (keys pass through)");
  }
</script>
</body>
</html>
