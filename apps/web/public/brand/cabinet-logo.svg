<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 256" role="img" aria-label="Cabinet">
  <defs>
    <linearGradient id="cab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.42" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="cab-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9c7d6"/>
    </linearGradient>
  </defs>

  <!-- mark: the "C" of Cabinet, drawn as a power symbol -->
  <g transform="translate(24 24) scale(0.8125)">
    <rect x="16" y="16" width="480" height="480" rx="118" fill="url(#cab)"/>
    <rect x="16" y="16" width="480" height="480" rx="118" fill="url(#cab-light)"/>
    <g stroke="#ffffff" stroke-width="46" stroke-linecap="round" fill="none">
      <path d="M 324.8 173.7 A 120 120 0 1 1 187.2 173.7"/>
      <path d="M 256 132 L 256 258"/>
    </g>
  </g>

  <!-- wordmark -->
  <text
    x="480"
    y="167"
    fill="url(#word)"
    font-family="Inter, 'SF Pro Display', system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="132"
    font-weight="600"
    letter-spacing="-4"
  >Cabinet</text>
</svg>
